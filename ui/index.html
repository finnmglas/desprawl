<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <!-- the run token lives in the url, so no request may carry the url anywhere -->
    <meta name="referrer" content="no-referrer" />
    <title>desprawl</title>
    <script>
      // before paint, so a stored or system theme never flashes the wrong one
      try {
        var asked = new URLSearchParams(location.search).get("theme")
        var t = asked || localStorage.getItem("desprawl-theme") || "system"
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
